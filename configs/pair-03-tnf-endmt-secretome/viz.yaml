run_id: pair-03-tnf-endmt-secretome
output_dir: runs/pair-03-tnf-endmt-secretome/viz

inputs:
  abundance_wide: null
  abundance_long: null
  annotation: null
  contrast_table: null
  protein_id_column: Protein ID
  gene_column: Gene
  log2fc_column: log2FC
  p_value_column: p_value
  adj_p_column: adj_p

contrast:
  id: tnf48h_vs_control48h
  label: TNF-α 48h vs control 48h (HMVEC secretome)
  direction: treatment - control
  method: limma_like_moderated_ttest+lfq
  group_a: control
  group_b: treatment

thresholds:
  p_value_mode: adjusted
  p_cutoff: 0.05
  # Paper framed ~1.5-fold among shared detections
  abs_log2_fc_cutoff: 0.585
  significant_only_table: true
  adaptive:
    enabled: false

plots:
  qc_missingness: true
  qc_intensity_hist: true
  qc_intensity_box: true
  qc_correlation: false
  qc_median_vs_missing: false
  volcano_adj_p: true
  volcano_raw_p: false
  go_enrichment: false

go:
  enabled: false
  mode: skip

markers:
  enabled: true
  # Explicit EndMT / CAF panel — absent markers are reported, not dropped
  ids:
    - PECAM1
    - CDH5
    - ACTA2
    - S100A4
    - COL1A1
    - COL1A2
    - VIM
    - TNFSF12
    - TNF
    - CXCL8
  aliases:
    PECAM1: ["CD31", "PECAM-1"]
    CDH5: ["VE-cadherin", "CD144"]
    ACTA2: ["alpha-SMA", "α-SMA", "ACTSA"]
    S100A4: ["FSP1"]
    TNFSF12: ["TWEAK", "APO3L"]

exports:
  formats: [png, csv, json, md]
  dpi: 150
  write_qc_conclusions: true
  write_significant_table: true
  write_report_index: true

style:
  missing_as_zero: true
  log_intensity_base: 10

forbid_approximate_de: true
